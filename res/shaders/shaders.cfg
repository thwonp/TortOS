# plorpOS shaders: the in-game menu's Shader list, in order (GKD only,
# plorpos-gkd.72). None is always first and is not listed here.
#
#   name | passes | final
#
# name is what the menu shows and what shader.<TAG> stores, so renaming an
# entry sends every system that chose it back to None.
#
# passes: up to three, comma-separated, each file:filter:scale - a .glsl file
# in this folder (without the extension), how that pass samples its input
# (nearest | linear), and its output size: 0 is the screen rect, 1-4 that many
# times its input. diatom's ADR-0041 has the protocol this becomes.
#
# final: how the last copy scales when the last pass has a scale (nearest |
# linear); unused when it is 0.
#
# The presets are NextUI's (skeleton/BASE/Shaders/*.cfg), shader part only,
# duplicates merged: scanlines is res-independent-scanlines alone, and
# real-gameboy and real-gba share one chain (Real LCD; their palettes are
# plorpos-gkd.76). The singles draw at the screen rect, nearest, except the
# sharp ones, which are built on bilinear sampling. stock alone is None, so it
# is only in a preset. Dropped for cost (plorpos-gkd.72.1): aa-shader-4.0,
# bicubic, pixel_art_AA. Dropped after a look on the GKD (plorpos-gkd.72.5):
# Pixel Perfect Sharp (pixellate alone), Sharp Bilinear and Sharp Shimmerless
# VRGB - at 1600x1440 no different from None - and Scale3x and Waterpaint.
#
# Pixel Transparency is not NextUI's: SkyWalker541's PT_SkyWalker541 v1.8.0
# (MIT), with its own defaults (Game Boy backing, grid); after LCD 3x it is
# the last pass, as its author intends, and reads the raw frame through
# OrigTexture (plorpos-gkd.86.1).

Old TV                 | barrel-distortion:nearest:0,res-independent-scanlines:nearest:0 | nearest
Pixel Perfect Smooth   | stock:nearest:3                                                 | linear
Pixel Transparency + LCD 3x | lcd3x:nearest:0,PT_SkyWalker541:nearest:0                 | nearest
Real LCD               | pixellate:nearest:0,lcd3x:nearest:0                             | nearest
Scanlines              | res-independent-scanlines:nearest:0                             | nearest

Barrel Distortion      | barrel-distortion:nearest:0                                     | nearest
Smooth Edges           | edge1pixel:nearest:0                                            | nearest
Fast Sharpen           | fast-sharpen:nearest:0                                          | nearest
LCD 1x                 | lcd1x:nearest:0                                                 | nearest
LCD 3x                 | lcd3x:nearest:0                                                 | nearest
Pixel Transparency     | PT_SkyWalker541:nearest:0                                       | nearest
Retro v2               | retro-v2:nearest:0                                              | nearest
Scanlines Classic      | scanline:nearest:0                                              | nearest
Sharp Shimmerless      | sharp-shimmerless:linear:0                                      | nearest
Sharp Shimmerless Grid | sharp-shimmerless-grid:linear:0                                 | nearest
