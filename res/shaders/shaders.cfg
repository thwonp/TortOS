# plorpOS shaders: the in-game menu's Shader list, in order (GKD only,
# plorpos-gkd.72). None is always first and is not listed here.
#
#   name | passes | final
#
# name is what the menu shows and what shader.<TAG> stores, so renaming an
# entry sends every system that chose it back to None.
#
# passes: up to three, comma-separated, each file:filter:scale - a .glsl file
# in this folder (without the extension), how that pass samples its input
# (nearest | linear), and its output size: 0 is the screen rect, 1-4 that many
# times its input. diatom's ADR-0041 has the protocol this becomes.
#
# final: how the last copy scales when the last pass has a scale (nearest |
# linear); unused when it is 0.
#
# The presets are NextUI's (skeleton/BASE/Shaders/*.cfg), shader part only,
# duplicates merged: pixelperfect-sharp is pixellate alone, scanlines is
# res-independent-scanlines alone, and real-gameboy and real-gba share one
# chain (Real LCD; their palettes are plorpos-gkd.76). The singles draw at the
# screen rect, nearest, except the sharp ones, which are built on bilinear
# sampling. stock alone is None, so it is only in a preset. Dropped for cost
# (plorpos-gkd.72.1): aa-shader-4.0, bicubic, pixel_art_AA.

Old TV                 | barrel-distortion:nearest:0,res-independent-scanlines:nearest:0 | nearest
Pixel Perfect Sharp    | pixellate:nearest:0                                             | nearest
Pixel Perfect Smooth   | stock:nearest:3                                                 | linear
Real LCD               | pixellate:nearest:0,lcd3x:nearest:0                             | nearest
