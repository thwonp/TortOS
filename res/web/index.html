<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Over The Hare</title>
<!-- The shell without the head. The full mark is two thirds head by width, so
     squeezed into a 16px square the shell is a smudge; the six cells and the
     charge stay legible. tools/genhare.py writes it. -->
<link rel="icon" type="image/svg+xml" href="/web/icon.svg">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>

<!-- The PIN gate. Shown until /api/auth accepts, and the only thing a
     browser can reach without a session. -->
<section id="gate" class="gate">
  <div class="panel">
    <img class="logo" src="/web/mark.svg" alt="" width="120" height="80">
    <h1>Over The Hare</h1>
    <p class="sub">Enter the PIN shown on the device</p>
    <form id="pinform" autocomplete="off">
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4"
             aria-label="PIN" autocomplete="one-time-code">
      <button type="submit">Open</button>
    </form>
    <p id="gatemsg" class="msg" role="status"></p>
  </div>
</section>

<!-- Everything past the gate. -->
<section id="app" class="app" hidden>
  <header>
    <!-- The real drawn size, so the bar does not jump on a cold load before the
         stylesheet arrives. The mark's viewBox is 210.8 x 112.8, so 84 tall is
         157 wide. -->
    <img class="logo small" src="/web/mark.svg" alt="Over The Hare" width="157" height="84">
    <nav id="crumbs" class="crumbs" aria-label="Location"></nav>
    <!-- A standing hint that files can be dropped, lit while one is over the
         window. Beside the crumbs rather than replacing them: with the pointer
         anywhere but a folder row, the crumbs are the only thing saying where a
         drop would land. It lives in the bar rather than floating over the page
         because the list begins the pixel below the header, so anything hovering
         there covers the first entry. Filled by refreshDropHint(). -->
    <p id="dropmsg" class="dropmsg" role="status"></p>
    <div class="tools">
      <button id="newfolder" class="ghost" title="New folder">New folder</button>
      <label class="ghost" for="picker">Upload</label>
      <input id="picker" type="file" multiple hidden>
      <!-- A whole folder - an album, a book - with the folders inside it. -->
      <label class="ghost" for="folderpicker">Upload folder</label>
      <input id="folderpicker" type="file" webkitdirectory multiple hidden>
    </div>
  </header>

  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here yet.</p>

  <!-- Download logs, on the first page only: a bug report as one file, packed
       by the device when asked. The server names the download. -->
  <p id="logs" class="logs" hidden>
    <a class="ghost" href="/api/logs" download>Download logs</a>
    <span>For whoever is helping you with a problem. Network, headset and
    account names are masked.</span>
  </p>

  <!-- The frame only. The words live in the header, where they cover nothing. -->
  <div id="drop" class="drop" hidden></div>

  <footer id="queue" class="queue" hidden>
    <ul id="queuelist"></ul>
  </footer>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/web/app.js"></script>
</body>
</html>
