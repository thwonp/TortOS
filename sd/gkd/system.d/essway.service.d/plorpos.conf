# plorpOS in place of EmulationStation when its launch script is on the card;
# stock ES otherwise. Delete this file for stock.
[Service]
ExecStart=
ExecStart=/bin/sh -c '[ -f /storage/games-external/TortOS/launch.sh ] && exec /bin/sh /storage/games-external/TortOS/launch.sh; exec /usr/bin/start_es.sh'
