# ROCKNIX's automount creates an empty folder per system (~130) in the card's
# roms/ at every mount - create_game_dirs, from system-dirs.conf. An empty file
# over that list while automount runs, so none appear. Boot and card insert
# both run automount through this unit. Fails soft: if the list moves, automount
# runs as stock.
[Service]
ExecStartPre=-/bin/sh -c 'umount /usr/config/system-dirs.conf 2>/dev/null; : > /run/plorpos-empty && mount --bind /run/plorpos-empty /usr/config/system-dirs.conf'
ExecStartPost=-/bin/umount /usr/config/system-dirs.conf
