# plorpOS-Nano's /etc/asound.conf (install-root.sh puts it there). FunKey's,
# with the mono speaker's mix at half per channel: both channels at full
# summed into one clipped loud music (Muse plays to "monocard"). Games use the
# kernel's OSS /dev/dsp and do not come through here.
pcm.monocard {
  slave.pcm "hw:0"
  slave.channels 2
  type route
  ttable {
    # Both input channels into output channel 1 (Right), the speaker's.
    0.1 0.5
    1.1 0.5
    # Nothing to channel 0 (Left).
    0.0 0
    1.0 0
  }
}

pcm.!default monocard
